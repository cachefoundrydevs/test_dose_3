name: soc wrapper
# Lint and simulation of the old SoC port-map wrapper (top dcache_v5_v14_compat) only: Verilator lint of that top and
# the tb_l1d_soc runs with -DL1D_V14_COMPAT_TOP from tests.txt. Results go to the branch soc-wrapper.
on:
  push:
    paths:
      - 'wrapper/**'
      - '.github/workflows/soc_wrapper.yml'
permissions:
  contents: write
jobs:
  soc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: lint and simulate the wrapper
        run: |
          set -u
          mkdir -p build logs
          exec > >(tee logs/console.txt) 2>&1
          RTL=$(grep -v '^[-#]' filelists/rtl.f | sed '/^\s*$/d')
          DL2=$(grep -v '^[-#]' filelists/dummy_l2.f | sed '/^\s*$/d')
          SPW=$(grep -v '^[-#]' filelists/single_port.f | sed '/^\s*$/d')
          SOC=wrapper/dcache_v5_v14_compat.v
          INC="-Irtl/include -Irtl/prefetch/stride"
          TBC="tb/common/axi_mem_model.v tb/common/snoop_gen.v"
          status=0
          verilator --version; iverilog -V 2>&1 | head -1
          verilator --lint-only -Wall -Wno-fatal -Wno-DECLFILENAME -Wno-UNUSEDPARAM $INC --top-module dcache_v5_v14_compat \
              $RTL $DL2 $SPW $SOC > logs/lint.log 2>&1
          grep -c '%Warning' logs/lint.log | xargs echo "lint warnings:"
          grep '%Warning' logs/lint.log | grep -i 'dcache_v5_v14_compat' | head -40 || true
          if grep -q '%Error' logs/lint.log; then grep '%Error' logs/lint.log | head -80; echo "LINT: FAIL"; status=1; else echo "LINT: PASS"; fi
          passed=0; failed=0
          while read -r line; do
            case "$line" in *L1D_V14_COMPAT_TOP*) ;; *) continue;; esac
            set -- $(echo "$line" | tr -d '"')
            t=$1; shift; defs=""; name=$t
            while [ $# -gt 0 ]; do
              if [ "$1" = "-d" ]; then defs="$defs -D$2"; name="${name}_$(echo "$2" | tr '=' '_')"; shift 2; else shift; fi
            done
            echo "--- $name ---"
            if ! iverilog -g2012 $INC -Itb/common $defs -s $t -o build/$name.vvp $RTL $DL2 $SPW $SOC $TBC tb/tests/$t.v > logs/${name}_compile.log 2>&1; then
              head -60 logs/${name}_compile.log; echo "FAIL $name (compile)"; failed=$((failed+1)); status=1; continue
            fi
            timeout 3000 vvp -n build/$name.vvp > logs/$name.log 2>&1
            tail -12 logs/$name.log
            if grep -q "TEST PASSED" logs/$name.log && ! grep -q "L1D.*ERROR" logs/$name.log; then echo "PASS $name"; passed=$((passed+1)); else echo "FAIL $name"; failed=$((failed+1)); status=1; fi
          done < tests.txt
          echo "=== Summary: $passed passed, $failed failed ==="
          echo $status > logs/status.txt
          git rev-parse HEAD > logs/commit.txt
      - name: publish logs to the branch soc-wrapper
        if: always()
        run: |
          set -eu
          cp -r logs /tmp/logs
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan soc-wrapper; git rm -rq --cached . ; git clean -fdq
          cp -r /tmp/logs/* .; rm -f *.vvp; git add -A; git commit -qm "soc wrapper run"; git push -f origin soc-wrapper
      - name: result
        run: test "$(cat logs/status.txt)" = "0"
